<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Mi Plata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="index.html">Mi Plata</a>
  <nav class="nav-actions">
    <a class="btn btn-primary" href="registro.html">Registrarse</a>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Inicia sesión</h1>
    <p class="subtitle">Ingresa tu usuario y contraseña.</p>

    <div id="mensaje" class="form-message"></div>

    <form id="formLogin" novalidate>
      <div class="field">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" required>
      </div>
      <div class="field">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>

    <p class="auth-footer">¿Aún no tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </div>
</div>

<script type="module" src="js/app-auth.js"></script>
</body>
</html>
